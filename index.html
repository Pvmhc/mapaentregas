<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--green:#15803d;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding-bottom:30px}
.top{position:sticky;top:0;z-index:20;background:rgba(243,244,246,.96);backdrop-filter:blur(12px);padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0;font-weight:800}
.date{font-size:12px;color:var(--muted);margin-top:3px}
.count{background:#111827;color:white;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
.search{margin-top:10px;display:flex;gap:8px}
input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:white;padding:0 12px;font-size:15px;outline:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cards{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;padding:13px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.main{display:flex;justify-content:space-between;gap:10px}
.name{font-weight:800;font-size:16px;line-height:1.2}
.city{font-size:13px;color:var(--muted);margin-top:3px}
.client{font-size:12px;color:var(--muted);white-space:nowrap}
.client b{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;font-weight:800}
.value{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:800;text-decoration:none}
.call{margin-top:11px;display:flex;align-items:center;justify-content:center;height:42px;border-radius:12px;background:#ecfdf5;color:#166534;text-decoration:none;font-weight:800}
.order{margin-top:10px;font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.footer{padding:0 12px;text-align:center;color:#9ca3af;font-size:11px}
@media(min-width:600px){.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin:0}}
</style>

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const phone=s=>String(s??'').replace(/[^\d+]/g,'');
const unique=a=>[...new Set(a.filter(Boolean))].sort((x,y)=>x.localeCompare(y,'pt-PT'));
function fillFilters(){
  unique(DATA.map(x=>x.vendedor)).forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$('seller').appendChild(o)});
  unique(DATA.map(x=>x.motorista)).forEach(v=>{let o=document.createElement('option');o.value=v;o.textContent=v;$('driver').appendChild(o)});
}
function render(){
  const q=$('search').value.trim().toLowerCase(), s=$('seller').value, d=$('driver').value;
  const out=DATA.filter(x=>{
    const hay=[x.cliente,x.nome,x.cidade,x.vendedor,x.motorista,x.contacto,x.ordem].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!s||x.vendedor===s)&&(!d||x.motorista===d);
  });
  $('count').textContent=out.length;
  $('empty').hidden=out.length!==0;
  $('cards').innerHTML=out.map(x=>{
    const p=phone(x.contacto);
    return `<article class="card">
      <div class="main">
        <div><div class="name">${esc(x.nome||'Sem estabelecimento')}</div><div class="city">${esc(x.cidade||'')}</div></div>
        <div class="client">Cliente<br><b>${esc(x.cliente||'—')}</b></div>
      </div>
      <div class="grid">
        <div><div class="label">Vendedor</div><div class="value">${esc(x.vendedor||'—')}</div></div>
        <div><div class="label">Motorista</div><div class="value">${esc(x.motorista||'—')}</div></div>
      </div>
      <div class="grid">
        <div><div class="label">Contacto</div><div class="value">${p?`<a class="contact" href="tel:${esc(p)}">☎ ${esc(x.contacto)}</a>`:esc(x.contacto||'—')}</div></div>
        <div><div class="label">Estado</div><div class="value">${esc(x.status||'—')}</div></div>
      </div>
      ${p?`<a class="call" href="tel:${esc(p)}">📞 Ligar para o cliente</a>`:''}
      ${x.ordem?`<div class="order">Ordem: ${esc(x.ordem)}</div>`:''}
    </article>`;
  }).join('');
}
['search','seller','driver'].forEach(id=>$(id).addEventListener('input',render));
fillFilters();render();
