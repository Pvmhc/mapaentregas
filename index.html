body{transition:background .2s,color .2s}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding-bottom:30px}
.top{position:sticky;top:0;z-index:20;background:var(--top);backdrop-filter:blur(12px);padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px}

.date{font-size:12px;color:var(--muted);margin-top:3px}

.main{display:flex;justify-content:space-between;gap:10px}

.client{font-size:12px;color:var(--muted);white-space:nowrap}
.client b{color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--label);font-weight:800}
.value{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:800;text-decoration:none}
.call{margin-top:11px;display:flex;align-items:center;justify-content:center;height:42px;border-radius:12px;background:var(--call-bg);color:var(--call-text);text-decoration:none;font-weight:800}

.v1{background:#dcfce7;color:#166534}.v2{background:#dbeafe;color:#1e40af}.v3{background:#fef3c7;color:#92400e}

.order{margin-top:10px;font-size:11px;color:var(--muted)}

.pin-dots i.on{background:var(--text);border-color:var(--text)}

let ACTIVE_DATA=[...DATA];
let loadedDate='08/10/2026';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const phone=s=>String(s??'').replace(/[^\d+]/g,'');
const unique=a=>[...new Set(a.filter(Boolean).map(String))].sort((x,y)=>x.localeCompare(y,'pt-PT'));
function fillFilters(){
  const sel=$('seller').value, drv=$('driver').value;
  // Cada filtro só mostra opções que têm encomendas com a escolha do outro filtro.
  const sellers=unique(ACTIVE_DATA.filter(x=>!drv||x.motorista===drv).map(x=>x.vendedor));
  const drivers=unique(ACTIVE_DATA.filter(x=>!sel||x.vendedor===sel).map(x=>x.motorista));
  const fill=(el,label,list,cur)=>{
    el.innerHTML='';
    const first=document.createElement('option');first.value='';first.textContent=label;el.appendChild(first);
    list.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)});
    el.value=list.includes(cur)?cur:'';
  };
  fill($('seller'),'Todos os vendedores',sellers,sel);
  fill($('driver'),'Todos os motoristas',drivers,drv);
}
function render(){
  const q=$('search').value.trim().toLowerCase(), s=$('seller').value, d=$('driver').value;
  const out=ACTIVE_DATA.filter(x=>{
    const hay=[x.cliente,x.nome,x.cidade,x.vendedor,x.motorista,x.contacto,x.ordem,x.transporte].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!s||x.vendedor===s)&&(!d||x.motorista===d);
  });
  const uniqueClients=new Set(out.map(x=>String(x.cliente||'').trim()).filter(Boolean));
  $('count').textContent=uniqueClients.size;
  $('empty').hidden=out.length!==0;

  // Define a volta de cada transporte por motorista: o número mais pequeno é a 1.ª volta.
  const transportByDriver=new Map();
  ACTIVE_DATA.forEach(x=>{
    const motorista=String(x.motorista||'').trim();
    const transporte=String(x.transporte||'').trim();
    if(!motorista || !transporte) return;
    if(!transportByDriver.has(motorista)) transportByDriver.set(motorista,new Set());
    transportByDriver.get(motorista).add(transporte);
  });
  const voltaInfo=new Map();
  transportByDriver.forEach((set,motorista)=>{
    const lista=[...set].sort((a,b)=>{
      const na=parseFloat(String(a).replace(',','.'));
      const nb=parseFloat(String(b).replace(',','.'));
      if(Number.isFinite(na)&&Number.isFinite(nb)) return na-nb;
      if(Number.isFinite(na)) return -1;
      if(Number.isFinite(nb)) return 1;
      return String(a).localeCompare(String(b),'pt-PT');
    });
    lista.forEach((transporte,i)=>voltaInfo.set(motorista+'|'+transporte,{numero:i+1,total:lista.length}));
  });

  // Mostra primeiro a 1.ª volta e depois a 2.ª volta.
  out.sort((a,b)=>{
    const va=voltaInfo.get(String(a.motorista||'').trim()+'|'+String(a.transporte||'').trim())?.numero||999;
    const vb=voltaInfo.get(String(b.motorista||'').trim()+'|'+String(b.transporte||'').trim())?.numero||999;
    if(va!==vb) return va-vb;
    return String(a.nome||'').localeCompare(String(b.nome||''),'pt-PT');
  });

  $('cards').innerHTML=out.map(x=>{
    const p=phone(x.contacto);
    return `<article class="card">
      <div class="main">
        <div><div class="name">${esc(x.nome||'Sem estabelecimento')}</div><div class="city">${esc(x.cidade||'')}</div></div>
        <div class="client">Cliente<br><b>${esc(x.cliente||'—')}</b></div>
      </div>
      <div class="grid">
        <div><div class="label">Vendedor</div><div class="value">${esc(x.vendedor||'—')}</div></div>
        <div><div class="label">Motorista</div><div class="value">${esc(x.motorista||'—')}</div></div>
      </div>
      <div class="grid">
        <div><div class="label">Contacto motorista</div><div class="value">${p?`<a class="contact" href="tel:${esc(p)}">☎ ${esc(x.contacto)}</a>`:esc(x.contacto||'—')}</div></div>
        <div><div class="label">Estado</div><div class="value">${(()=>{const info=voltaInfo.get(String(x.motorista||'').trim()+'|'+String(x.transporte||'').trim()); return esc(String(x.status||'').trim()||'—')})()}</div>${(()=>{const info=voltaInfo.get(String(x.motorista||'').trim()+'|'+String(x.transporte||'').trim()); return info?`<span class="volta v${Math.min(info.numero,3)}">${info.numero}ª volta</span>`:''})()}</div>
      </div>
      ${x.transporte?`<div class="order">Transporte: ${esc(String(x.transporte).replace(/\.0$/,''))}</div>`:''}
      ${p?`<a class="call" href="tel:${esc(p)}">📞 Ligar para o motorista</a>`:''}
      ${x.ordem?`<div class="order">Ordem: ${esc(x.ordem)}</div>`:''}
    </article>`;
  }).join('');
}
function normalizeDate(v){
  if(v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(),v.getMonth(),v.getDate());
  if(typeof v==='number'){ const d=XLSX.SSF.parse_date_code(v); return d?new Date(d.y,d.m-1,d.d):null; }
  const s=String(v??'').trim(); if(!s)return null;
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1]);
  const d=new Date(s); return isNaN(d)?null:new Date(d.getFullYear(),d.getMonth(),d.getDate());
}
function formatDate(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function importExcel(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
      const sheetName=wb.SheetNames.find(n=>n.trim().toUpperCase()==='ORDER.STATUS.DIA');
      if(!sheetName) throw new Error('A aba "ORDER.STATUS.DIA" não foi encontrada.');
      const ws=wb.Sheets[sheetName];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
      if(!rows.length) throw new Error('A aba ORDER.STATUS.DIA não contém dados.');
      const norm=k=>String(k).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
      const transpKey=Object.keys(rows[0]).find(k=>norm(k).includes('transporte'))||'Nº transporte';
      const dateKey='Data solic.remessa';
      const dates=rows.map(r=>normalizeDate(r[dateKey])).filter(Boolean);
      if(!dates.length) throw new Error('Não encontrei a coluna "Data solic.remessa" com datas válidas.');
      const latest=new Date(Math.max(...dates.map(d=>d.getTime())));
      const isoLatest=latest.toISOString().slice(0,10);
      const imported=rows.filter(r=>{
        const d=normalizeDate(r[dateKey]);
        return d && d.toISOString().slice(0,10)===isoLatest && String(r['Cliente']??'').trim()!=='';
      }).map(r=>({
        cliente:String(r['Cliente']??'').trim(),
        nome:String(r['Nome']??'').trim(),
        cidade:String(r['Cidade']??'').trim(),
        vendedor:String(r['Nome do vendedor']??'').trim(),
        motorista:String(r['Motorista']??'').trim(),
        contacto:String(r['Contactos']??'').trim(),
        status:String(r['Stat. aprovação']??'').trim(),
        ordem:String(r['Documento Outbound']??'').trim(),
        transporte:String(r[transpKey]??'').trim().replace(/\.0+$/,''),
        id:String(r['Documento de vendas']??'').trim()
      }));
      if(!imported.length) throw new Error('Não foram encontrados clientes para a data mais recente da folha.');
      ACTIVE_DATA=imported;
      loadedDate=formatDate(latest);
      document.querySelector('.date').textContent='Dados importados — '+loadedDate;
      $('seller').value='';$('driver').value='';
      fillFilters(); render();
      alert(`Excel importado com sucesso.\n\nData: ${loadedDate}\nRegistos: ${imported.length}\nClientes únicos: ${new Set(imported.map(x=>x.cliente)).size}`);
    }catch(err){alert('Não foi possível importar o Excel.\n\n'+err.message);}
    $('excelInput').value='';
  };
  reader.readAsArrayBuffer(file);
}
const IMPORT_PIN='2363';
let pinVal='';
const pinBack=$('pinBack'),pinDots=$('pinDots');
function pinDraw(){[...pinDots.children].forEach((d,i)=>d.classList.toggle('on',i<pinVal.length));}
function pinClose(){pinBack.classList.remove('show');pinVal='';pinDraw();}
function pinKey(k){
  if(k==='x'){pinClose();return;}
  if(k==='b'){pinVal=pinVal.slice(0,-1);pinDraw();return;}
  if(!/^\d$/.test(k)||pinVal.length>=4)return;
  pinVal+=k;pinDraw();
  if(pinVal.length===4){
    if(pinVal===IMPORT_PIN){pinClose();$('excelInput').click();}
    else{pinDots.classList.add('err');if(navigator.vibrate)navigator.vibrate(120);
      setTimeout(()=>{pinDots.classList.remove('err');pinVal='';pinDraw();},400);}
  }
}
$('importBtn').addEventListener('click',()=>{pinVal='';pinDraw();pinBack.classList.add('show');});
$('pinPad').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pinKey(b.dataset.k);});
pinBack.addEventListener('click',e=>{if(e.target===pinBack)pinClose();});
document.addEventListener('keydown',e=>{
  if(!pinBack.classList.contains('show'))return;
  if(e.key>='0'&&e.key<='9')pinKey(e.key);
  else if(e.key==='Backspace')pinKey('b');
  else if(e.key==='Escape')pinKey('x');
});
$('excelInput').addEventListener('change',e=>{if(e.target.files[0])importExcel(e.target.files[0])});
$('search').addEventListener('input',render);
['seller','driver'].forEach(id=>$(id).addEventListener('change',()=>{fillFilters();render();}));
function setTheme(t,save){
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#070b14':'#111827');
  if(save){try{localStorage.setItem('orderStatusTheme',t)}catch(e){}}
}
$('themeBtn').addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark',true));
try{
  const mq=matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change',e=>{let saved=null;try{saved=localStorage.getItem('orderStatusTheme')}catch(_){}if(!saved)setTheme(e.matches?'dark':'light',false);});
}catch(e){}
fillFilters();render();
</script>
<script>
// PWA: registo do Service Worker + convite de instalação
let deferredInstallPrompt=null;
const installPrompt=document.getElementById('installPrompt');
const installFab=document.getElementById('installFab');
const installNow=document.getElementById('installNow');
const installClose=document.getElementById('installClose');
const INSTALL_DISMISSED='orderStatusInstallDismissed';
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
function hideInstallUI(){installPrompt.classList.remove('show');installFab.classList.remove('show');}
function showInstallUI(){if(!isStandalone() && !localStorage.getItem(INSTALL_DISMISSED)){installPrompt.classList.add('show');}}
if ('serviceWorker' in navigator) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  setTimeout(showInstallUI,900);
});
window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  localStorage.setItem(INSTALL_DISMISSED,'1');
  hideInstallUI();
});
installNow.addEventListener('click',async()=>{
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{await deferredInstallPrompt.userChoice;}catch(e){}
    deferredInstallPrompt=null;
    hideInstallUI();
    return;
  }
  // iPhone/iPad: mostrar instruções quando o navegador não disponibiliza o prompt nativo.
  alert('Para instalar no iPhone/iPad: toque em Partilhar e escolha “Adicionar ao ecrã principal”.');
});
installClose.addEventListener('click',()=>{
  localStorage.setItem(INSTALL_DISMISSED,'1');
  hideInstallUI();
  if(deferredInstallPrompt) installFab.classList.add('show');
});
installFab.addEventListener('click',()=>{installFab.classList.remove('show');installPrompt.classList.add('show');});
window.addEventListener('load',()=>{
  if(!isStandalone() && localStorage.getItem(INSTALL_DISMISSED)!=='1'){
    setTimeout(()=>{if(deferredInstallPrompt) showInstallUI();},1200);
  }
});
</script>
